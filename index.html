<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Math Shooting Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background: #000;
            touch-action: none;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        #hiddenVideo {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            transition: opacity 0.3s;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
            padding: 0 1rem;
        }

        .overlay p {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 2rem;
            text-align: center;
            padding: 0 1rem;
            max-width: 600px;
            line-height: 1.5;
        }

        .btn {
            padding: 1rem 2rem;
            margin: 0.5rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar {
            width: 80%;
            max-width: 400px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
        }

        #hud {
            position: fixed;
            top: env(safe-area-inset-top, 0);
            left: env(safe-area-inset-left, 0);
            right: env(safe-area-inset-right, 0);
            padding: 0.8rem;
            z-index: 100;
            color: white;
            pointer-events: none;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem;
            gap: 0.4rem;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.8);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .player-scores {
            display: flex;
            gap: 0.5rem;
            flex: 1;
            justify-content: center;
        }

        .player-score {
            background: rgba(0, 0, 0, 0.85);
            padding: 0.5rem 1rem;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            border: 2px solid #667eea;
            backdrop-filter: blur(8px);
        }

        .question-display {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.95), rgba(118, 75, 162, 0.95));
            padding: 1rem 2rem;
            border-radius: 14px;
            font-size: 2.2rem;
            text-align: center;
            margin: 0.8rem auto;
            max-width: 90%;
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.5);
            font-weight: bold;
            backdrop-filter: blur(8px);
        }

        .streak-glow {
            animation: streakPulse 1.5s infinite;
            border-color: #FFD700 !important;
        }

        @keyframes streakPulse {
            0%, 100% { box-shadow: 0 0 15px rgba(255, 215, 0, 0.6); }
            50% { box-shadow: 0 0 30px rgba(255, 215, 0, 1); }
        }

        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: bold;
            z-index: 500;
            pointer-events: none;
            animation: feedbackPop 0.8s ease-out forwards;
            text-shadow: 0 0 20px currentColor, 0 0 40px currentColor, 0 4px 8px rgba(0, 0, 0, 0.8);
            letter-spacing: 2px;
        }

        @keyframes feedbackPop {
            0% {
                transform: translate(-50%, -50%) scale(0.3) rotate(-5deg);
                opacity: 0;
                filter: blur(10px);
            }
            20% {
                transform: translate(-50%, -50%) scale(1.3) rotate(3deg);
                opacity: 1;
                filter: blur(0);
            }
            50% {
                transform: translate(-50%, -50%) scale(1.1) rotate(-1deg);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -60%) scale(0.9);
                opacity: 0;
                filter: blur(5px);
            }
        }

        /* Floating score popup at hit location */
        .floating-score {
            position: fixed;
            font-size: 2rem;
            font-weight: bold;
            pointer-events: none;
            z-index: 600;
            animation: floatUp 1s ease-out forwards;
            text-shadow: 0 0 15px currentColor, 0 2px 4px rgba(0, 0, 0, 0.8);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1.5);
                opacity: 1;
            }
            100% {
                transform: translateY(-80px) scale(0.8);
                opacity: 0;
            }
        }

        /* Combo multiplier display */
        .combo-display {
            position: fixed;
            top: 25%;
            right: 20px;
            font-size: 3rem;
            font-weight: bold;
            color: #FFD700;
            pointer-events: none;
            z-index: 500;
            animation: comboPulse 0.5s ease-out;
            text-shadow: 0 0 20px #FFD700, 0 0 40px #FF8C00;
        }

        @keyframes comboPulse {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Strategy hint popup */
        .strategy-hint {
            position: fixed;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, rgba(255, 215, 0, 0.95), rgba(255, 165, 0, 0.95));
            color: #000;
            padding: 0.8rem 1.5rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            z-index: 400;
            animation: hintSlide 0.4s ease-out;
            box-shadow: 0 4px 20px rgba(255, 215, 0, 0.4);
        }

        @keyframes hintSlide {
            0% { transform: translateX(-50%) translateY(20px); opacity: 0; }
            100% { transform: translateX(-50%) translateY(0); opacity: 1; }
        }

        .ranking {
            background: rgba(0, 0, 0, 0.95);
            padding: 1.5rem;
            border-radius: 20px;
            max-width: 90%;
            max-height: 60vh;
            overflow-y: auto;
            backdrop-filter: blur(15px);
        }

        .ranking-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.8rem;
            margin-bottom: 0.6rem;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
        }

        .ranking-entry.rank-1 {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            font-weight: bold;
        }

        .ranking-entry.rank-2 {
            background: linear-gradient(135deg, #C0C0C0 0%, #808080 100%);
            color: #000;
        }

        .ranking-entry.rank-3 {
            background: linear-gradient(135deg, #CD7F32 0%, #8B4513 100%);
            color: #fff;
        }

        .ranking-entry.current {
            border: 2px solid #667eea;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.5);
        }

        @media (max-width: 480px) {
            .overlay h1 { font-size: 1.8rem; }
            .question-display { font-size: 1.8rem; padding: 0.8rem 1.5rem; }
            .feedback { font-size: 2.5rem; }
            .hud-item { font-size: 0.85rem; padding: 0.4rem 0.8rem; }
            .player-score { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <video id="hiddenVideo" playsinline autoplay muted></video>
    <canvas id="gameCanvas"></canvas>

    <div id="hud" class="hidden">
        <div class="hud-row">
            <div class="hud-item" id="questionCount">1/10</div>
            <div class="hud-item" id="timeDisplay">60s</div>
        </div>
        <div class="hud-row player-scores">
            <div class="player-score" id="playerScore">0 pts</div>
        </div>
        <div class="question-display" id="questionDisplay">?</div>
    </div>

    <div id="loadingOverlay" class="overlay hidden">
        <div class="spinner"></div>
        <h1>Loading...</h1>
        <p id="loadingText">Initializing...</p>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div id="errorOverlay" class="overlay hidden">
        <h1>Error</h1>
        <p id="errorMessage">Something went wrong</p>
        <button class="btn" onclick="location.reload()">Retry</button>
    </div>

    <div id="rankingOverlay" class="overlay hidden">
        <h1>Results</h1>
        <div class="ranking" id="rankingDisplay"></div>
        <div class="btn-group">
            <button class="btn" onclick="nextRound()">Play Again</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>

    <script>
        'use strict';

        // ============================================
        // OPTIMIZED GLOBAL STATE
        // ============================================
        const STATE = {
            scene: null,
            camera: null,
            renderer: null,
            hands: null,
            videoElement: null,
            handsData: [],
            audioContext: null,
            audioBuffers: {},

            // Player
            player: { score: 0, streak: 0, accuracy: 0, shots: 0, hits: 0, bestStreak: 0 },

            // Game state
            timeLeft: 60,
            questionIndex: 0,
            currentQuestion: null,
            difficultyLevel: 1,

            // OPTIMIZED: Pre-allocated pools
            targetPool: [],
            particlePool: [],
            targets: [],
            particles: [],

            // OPTIMIZED: Cached crosshair (reused, not recreated)
            crosshair: null,
            crosshairTargetPos: { x: 0, y: 0, z: -8 },
            crosshairCurrentPos: { x: 0, y: 0, z: -8 },

            // Hand state
            handState: { state: 'idle', cooldownEnd: 0 },

            // Timing
            gameStartTime: 0,
            lastRenderTime: 0,
            lastDetectionTime: 0,

            // Flags
            isRunning: false,
            isPaused: false,
            modelReady: false,
            audioReady: false,

            // OPTIMIZED: Texture cache
            textureCache: new Map(),

            // OPTIMIZED: Material cache
            materials: {},

            // Best scores
            bestScores: []
        };

        // ============================================
        // CONFIGURATION
        // ============================================
        const CONFIG = {
            GESTURE: {
                EXTEND_THRESHOLD: 0.08,
                CURL_THRESHOLD: 0.05,
                COOLDOWN_MS: 300
            },
            MAX_TARGETS: 5,
            TARGET_POOL_SIZE: 8,
            PARTICLE_POOL_SIZE: 50,  // Increased for enhanced VFX
            QUESTIONS_PER_ROUND: 10,
            TIME_LIMIT: 60,
            SCORE_CORRECT: 100,
            SCORE_SMART: 50,
            PENALTY_WRONG: 20,
            CROSSHAIR_LERP: 0.25, // Smooth crosshair movement
            DETECTION_FPS: 25
        };

        // ============================================
        // MATH QUESTION GENERATOR
        // ============================================
        const QUESTION_TEMPLATES = [
            // Addition Make-10
            {
                type: 'addition_make10',
                difficulty: 1,
                hint: '10を作ろう！',
                generate: () => {
                    const a = 7 + Math.floor(Math.random() * 3);
                    const toTen = 10 - a;
                    const extra = 1 + Math.floor(Math.random() * 5);
                    const b = toTen + extra;
                    return { question: `${a} + ${b}`, answer: a + b, strategy: [10], hint: `${a}+${toTen}=10, +${extra}` };
                }
            },
            // Subtraction Count-up
            {
                type: 'subtraction_countup',
                difficulty: 2,
                hint: '差を数えよう！',
                generate: () => {
                    const answer = 3 + Math.floor(Math.random() * 8);
                    const a = 10 + Math.floor(Math.random() * 10);
                    const b = a - answer;
                    return { question: `${a} − ${b}`, answer, strategy: [answer], hint: `${b}から${a}まで` };
                }
            },
            // Multiplication Decompose
            {
                type: 'multiplication_decompose',
                difficulty: 3,
                hint: '分解して計算！',
                generate: () => {
                    const a = 5 + Math.floor(Math.random() * 4);
                    const b = 3 + Math.floor(Math.random() * 4);
                    const step1 = a * 2;
                    const step2 = a * (b - 2);
                    return { question: `${a} × ${b}`, answer: a * b, strategy: [step1, step2], hint: `${a}×2 + ${a}×${b-2}` };
                }
            },
            // Multiplication 9x shortcut
            {
                type: 'multiplication_9x',
                difficulty: 3,
                hint: '9の魔法！10倍して引く',
                generate: () => {
                    const b = 3 + Math.floor(Math.random() * 6);
                    const step1 = 10 * b;
                    return { question: `9 × ${b}`, answer: 9 * b, strategy: [step1], hint: `10×${b}−${b}` };
                }
            },
            // Inverse Multiplication
            {
                type: 'inverse_multiplication',
                difficulty: 4,
                hint: '？を探そう！',
                generate: () => {
                    const a = 3 + Math.floor(Math.random() * 5);
                    const answer = 2 + Math.floor(Math.random() * 6);
                    const b = a * answer;
                    return { question: `${a} × ? = ${b}`, answer, strategy: [answer], hint: `${b}÷${a}` };
                }
            }
        ];

        function generateQuestion() {
            const available = QUESTION_TEMPLATES.filter(t => t.difficulty <= STATE.difficultyLevel);
            const template = available[Math.floor(Math.random() * available.length)];
            const q = template.generate();

            const distractors = new Set();
            const range = 10 + STATE.difficultyLevel * 5;

            while (distractors.size < 3) {
                const offset = Math.floor(Math.random() * 10) - 5;
                const d = Math.max(0, Math.min(range, q.answer + offset));
                if (d !== q.answer && !q.strategy.includes(d)) {
                    distractors.add(d);
                }
            }

            const allNumbers = [q.answer, ...q.strategy, ...Array.from(distractors)];
            const uniqueNumbers = [...new Set(allNumbers)].slice(0, CONFIG.MAX_TARGETS);

            if (!uniqueNumbers.includes(q.answer)) {
                uniqueNumbers[uniqueNumbers.length - 1] = q.answer;
            }

            return { ...q, allNumbers: uniqueNumbers };
        }

        // ============================================
        // AUDIO SYSTEM (ENHANCED - REALISTIC SOUNDS)
        // ============================================
        async function initAudio() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                STATE.audioContext = new AudioContext();
                STATE.audioReady = true;
                console.log('[Audio] Context created, state:', STATE.audioContext.state);
            } catch (e) {
                console.warn('Audio init failed:', e);
            }
        }

        // Unlock audio on user interaction (required by browsers)
        async function unlockAudio() {
            if (!STATE.audioContext) {
                await initAudio();
            }
            if (STATE.audioContext && STATE.audioContext.state === 'suspended') {
                try {
                    await STATE.audioContext.resume();
                    console.log('[Audio] Context resumed, state:', STATE.audioContext.state);
                    // Play a silent sound to fully unlock
                    const buffer = STATE.audioContext.createBuffer(1, 1, 22050);
                    const source = STATE.audioContext.createBufferSource();
                    source.buffer = buffer;
                    source.connect(STATE.audioContext.destination);
                    source.start(0);
                } catch (e) {
                    console.warn('[Audio] Resume failed:', e);
                }
            }
        }

        // Add unlock listeners for various user interactions
        function setupAudioUnlock() {
            const unlockEvents = ['click', 'touchstart', 'touchend', 'keydown'];
            const unlockHandler = () => {
                unlockAudio();
                // Remove listeners after first interaction
                unlockEvents.forEach(event => {
                    document.removeEventListener(event, unlockHandler);
                });
            };
            unlockEvents.forEach(event => {
                document.addEventListener(event, unlockHandler, { passive: true });
            });
        }

        // Create noise buffer for explosion sounds
        function createNoiseBuffer(duration) {
            if (!STATE.audioContext) return null;
            const sampleRate = STATE.audioContext.sampleRate;
            const length = sampleRate * duration;
            const buffer = STATE.audioContext.createBuffer(1, length, sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < length; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (length * 0.3));
            }
            return buffer;
        }

        // Realistic gun shot sound
        function playShootSound() {
            if (!STATE.audioContext || !STATE.audioReady) return;

            const now = STATE.audioContext.currentTime;

            // Attack transient (click)
            const clickOsc = STATE.audioContext.createOscillator();
            const clickGain = STATE.audioContext.createGain();
            clickOsc.connect(clickGain);
            clickGain.connect(STATE.audioContext.destination);
            clickOsc.frequency.setValueAtTime(1200, now);
            clickOsc.frequency.exponentialRampToValueAtTime(100, now + 0.05);
            clickOsc.type = 'square';
            clickGain.gain.setValueAtTime(0.3, now);
            clickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
            clickOsc.start(now);
            clickOsc.stop(now + 0.05);

            // Low thump
            const thumpOsc = STATE.audioContext.createOscillator();
            const thumpGain = STATE.audioContext.createGain();
            thumpOsc.connect(thumpGain);
            thumpGain.connect(STATE.audioContext.destination);
            thumpOsc.frequency.setValueAtTime(150, now);
            thumpOsc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
            thumpOsc.type = 'sine';
            thumpGain.gain.setValueAtTime(0.4, now);
            thumpGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            thumpOsc.start(now);
            thumpOsc.stop(now + 0.1);

            // Noise burst
            const noiseBuffer = createNoiseBuffer(0.08);
            if (noiseBuffer) {
                const noiseSource = STATE.audioContext.createBufferSource();
                const noiseGain = STATE.audioContext.createGain();
                const noiseFilter = STATE.audioContext.createBiquadFilter();
                noiseSource.buffer = noiseBuffer;
                noiseSource.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(STATE.audioContext.destination);
                noiseFilter.type = 'highpass';
                noiseFilter.frequency.value = 1000;
                noiseGain.gain.setValueAtTime(0.2, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                noiseSource.start(now);
            }
        }

        // Explosion sound (balloon pop)
        function playExplosionSound(isCorrect) {
            if (!STATE.audioContext || !STATE.audioReady) return;

            const now = STATE.audioContext.currentTime;

            // Pop sound
            const popOsc = STATE.audioContext.createOscillator();
            const popGain = STATE.audioContext.createGain();
            popOsc.connect(popGain);
            popGain.connect(STATE.audioContext.destination);
            popOsc.frequency.setValueAtTime(isCorrect ? 800 : 400, now);
            popOsc.frequency.exponentialRampToValueAtTime(isCorrect ? 200 : 100, now + 0.15);
            popOsc.type = 'sine';
            popGain.gain.setValueAtTime(0.3, now);
            popGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            popOsc.start(now);
            popOsc.stop(now + 0.15);

            // Noise burst for pop texture
            const noiseBuffer = createNoiseBuffer(0.1);
            if (noiseBuffer) {
                const noiseSource = STATE.audioContext.createBufferSource();
                const noiseGain = STATE.audioContext.createGain();
                const noiseFilter = STATE.audioContext.createBiquadFilter();
                noiseSource.buffer = noiseBuffer;
                noiseSource.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(STATE.audioContext.destination);
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.value = isCorrect ? 2000 : 800;
                noiseFilter.Q.value = 1;
                noiseGain.gain.setValueAtTime(0.15, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                noiseSource.start(now);
            }
        }

        // Correct answer celebration sound
        function playCorrectSound() {
            if (!STATE.audioContext || !STATE.audioReady) return;

            const now = STATE.audioContext.currentTime;
            const notes = [523, 659, 784, 1047]; // C5, E5, G5, C6

            notes.forEach((freq, i) => {
                const osc = STATE.audioContext.createOscillator();
                const gain = STATE.audioContext.createGain();
                osc.connect(gain);
                gain.connect(STATE.audioContext.destination);
                osc.frequency.value = freq;
                osc.type = 'sine';
                const startTime = now + i * 0.08;
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.15, startTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.2);
                osc.start(startTime);
                osc.stop(startTime + 0.2);
            });
        }

        // Smart hit sound (golden)
        function playSmartSound() {
            if (!STATE.audioContext || !STATE.audioReady) return;

            const now = STATE.audioContext.currentTime;
            const notes = [659, 784, 880]; // E5, G5, A5

            notes.forEach((freq, i) => {
                const osc = STATE.audioContext.createOscillator();
                const gain = STATE.audioContext.createGain();
                osc.connect(gain);
                gain.connect(STATE.audioContext.destination);
                osc.frequency.value = freq;
                osc.type = 'triangle';
                const startTime = now + i * 0.06;
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.12, startTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
                osc.start(startTime);
                osc.stop(startTime + 0.25);
            });

            // Sparkle effect
            for (let i = 0; i < 5; i++) {
                const sparkle = STATE.audioContext.createOscillator();
                const sparkleGain = STATE.audioContext.createGain();
                sparkle.connect(sparkleGain);
                sparkleGain.connect(STATE.audioContext.destination);
                sparkle.frequency.value = 2000 + Math.random() * 2000;
                sparkle.type = 'sine';
                const startTime = now + 0.1 + i * 0.04;
                sparkleGain.gain.setValueAtTime(0.03, startTime);
                sparkleGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.08);
                sparkle.start(startTime);
                sparkle.stop(startTime + 0.08);
            }
        }

        // Wrong answer sound
        function playWrongSound() {
            if (!STATE.audioContext || !STATE.audioReady) return;

            const now = STATE.audioContext.currentTime;

            // Descending tone
            const osc = STATE.audioContext.createOscillator();
            const gain = STATE.audioContext.createGain();
            osc.connect(gain);
            gain.connect(STATE.audioContext.destination);
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.linearRampToValueAtTime(150, now + 0.3);
            osc.type = 'sawtooth';
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
            osc.start(now);
            osc.stop(now + 0.3);

            // Buzz
            const buzz = STATE.audioContext.createOscillator();
            const buzzGain = STATE.audioContext.createGain();
            buzz.connect(buzzGain);
            buzzGain.connect(STATE.audioContext.destination);
            buzz.frequency.value = 80;
            buzz.type = 'square';
            buzzGain.gain.setValueAtTime(0.1, now);
            buzzGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
            buzz.start(now);
            buzz.stop(now + 0.2);
        }

        // Miss sound (whoosh)
        function playMissSound() {
            if (!STATE.audioContext || !STATE.audioReady) return;

            const now = STATE.audioContext.currentTime;

            // Whoosh noise
            const noiseBuffer = createNoiseBuffer(0.15);
            if (noiseBuffer) {
                const noiseSource = STATE.audioContext.createBufferSource();
                const noiseGain = STATE.audioContext.createGain();
                const noiseFilter = STATE.audioContext.createBiquadFilter();
                noiseSource.buffer = noiseBuffer;
                noiseSource.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(STATE.audioContext.destination);
                noiseFilter.type = 'bandpass';
                noiseFilter.frequency.setValueAtTime(2000, now);
                noiseFilter.frequency.linearRampToValueAtTime(500, now + 0.15);
                noiseFilter.Q.value = 2;
                noiseGain.gain.setValueAtTime(0.08, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                noiseSource.start(now);
            }
        }

        // Combo sound (increasing excitement)
        function playComboSound(streak) {
            if (!STATE.audioContext || !STATE.audioReady) return;
            if (streak < 2) return;

            const now = STATE.audioContext.currentTime;
            const baseFreq = 400 + streak * 50;

            // Ascending arpeggio
            for (let i = 0; i < Math.min(streak, 5); i++) {
                const osc = STATE.audioContext.createOscillator();
                const gain = STATE.audioContext.createGain();
                osc.connect(gain);
                gain.connect(STATE.audioContext.destination);
                osc.frequency.value = baseFreq * (1 + i * 0.25);
                osc.type = 'sine';
                const startTime = now + i * 0.04;
                gain.gain.setValueAtTime(0.08, startTime);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.15);
                osc.start(startTime);
                osc.stop(startTime + 0.15);
            }

            // Big combo bonus sound
            if (streak >= 5) {
                const chord = [523, 659, 784, 1047];
                chord.forEach(freq => {
                    const osc = STATE.audioContext.createOscillator();
                    const gain = STATE.audioContext.createGain();
                    osc.connect(gain);
                    gain.connect(STATE.audioContext.destination);
                    osc.frequency.value = freq;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.05, now + 0.2);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                    osc.start(now + 0.2);
                    osc.stop(now + 0.6);
                });
            }
        }

        // Level up fanfare
        function playLevelUpSound() {
            if (!STATE.audioContext || !STATE.audioReady) return;

            const now = STATE.audioContext.currentTime;
            const notes = [523, 659, 784, 1047, 1319]; // C5, E5, G5, C6, E6

            notes.forEach((freq, i) => {
                const osc = STATE.audioContext.createOscillator();
                const gain = STATE.audioContext.createGain();
                osc.connect(gain);
                gain.connect(STATE.audioContext.destination);
                osc.frequency.value = freq;
                osc.type = 'sine';
                const startTime = now + i * 0.1;
                gain.gain.setValueAtTime(0, startTime);
                gain.gain.linearRampToValueAtTime(0.2, startTime + 0.03);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.4);
                osc.start(startTime);
                osc.stop(startTime + 0.4);
            });

            // Shimmer effect
            for (let i = 0; i < 10; i++) {
                const shimmer = STATE.audioContext.createOscillator();
                const shimmerGain = STATE.audioContext.createGain();
                shimmer.connect(shimmerGain);
                shimmerGain.connect(STATE.audioContext.destination);
                shimmer.frequency.value = 1500 + Math.random() * 2000;
                shimmer.type = 'sine';
                const startTime = now + 0.3 + i * 0.03;
                shimmerGain.gain.setValueAtTime(0.02, startTime);
                shimmerGain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.1);
                shimmer.start(startTime);
                shimmer.stop(startTime + 0.1);
            }
        }

        // Legacy playSFX wrapper for compatibility
        function playSFX(type) {
            switch(type) {
                case 'shoot':
                    playShootSound();
                    break;
                case 'correct':
                    playExplosionSound(true);
                    playCorrectSound();
                    break;
                case 'smart':
                    playExplosionSound(true);
                    playSmartSound();
                    break;
                case 'wrong':
                    playExplosionSound(false);
                    playWrongSound();
                    break;
                case 'miss':
                    playMissSound();
                    break;
                case 'combo':
                    playComboSound(STATE.player.streak);
                    break;
                case 'levelup':

                    break;
            }
        }

        // ============================================
        // TEXTURE CACHE (MAJOR OPTIMIZATION)
        // ============================================
        function getNumberTexture(number) {
            const key = String(number);
            if (STATE.textureCache.has(key)) {
                return STATE.textureCache.get(key);
            }

            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Clear background (transparent)
            ctx.clearRect(0, 0, 256, 256);

            // Draw text with shadow for visibility
            ctx.shadowColor = 'rgba(0, 0, 0, 0.8)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 140px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(key, 128, 128);

            // Draw outline for extra visibility
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 4;
            ctx.strokeText(key, 128, 128);

            const texture = new THREE.CanvasTexture(canvas);
            texture.minFilter = THREE.LinearFilter;
            STATE.textureCache.set(key, texture);

            return texture;
        }

        // Pre-generate common number textures
        function preloadTextures() {
            for (let i = 0; i <= 100; i++) {
                getNumberTexture(i);
            }
        }

        // Change crosshair color (green = normal, red = firing)
        function setCrosshairColor(color) {

                if (child.material) {
                    child.material.color.setHex(color);
                }
            });

        function updateCrosshairPosition(targetX, targetY, targetZ) {
            STATE.crosshairTargetPos.x = targetX;
            STATE.crosshairTargetPos.y = targetY;
            STATE.crosshairTargetPos.z = targetZ;
        }

        function interpolateCrosshair() {
            if (!STATE.crosshair) return;

            const lerp = CONFIG.CROSSHAIR_LERP;
            STATE.crosshairCurrentPos.x += (STATE.crosshairTargetPos.x - STATE.crosshairCurrentPos.x) * lerp;
            STATE.crosshairCurrentPos.y += (STATE.crosshairTargetPos.y - STATE.crosshairCurrentPos.y) * lerp;
            STATE.crosshairCurrentPos.z += (STATE.crosshairTargetPos.z - STATE.crosshairCurrentPos.z) * lerp;

            STATE.crosshair.position.set(
                STATE.crosshairCurrentPos.x,
                STATE.crosshairCurrentPos.y,
                STATE.crosshairCurrentPos.z
            );
            STATE.crosshair.lookAt(STATE.camera.position);
        }

        // ============================================
        // TARGET MANAGEMENT
        // ============================================
        function createTarget(number, isAnswer, isStrategy) {
            const target = getTarget();
            if (!target) return null;

            // Set material based on type
            if (isAnswer) {
                target.material.color.setHex(0x4CAF50);
                target.material.emissive.setHex(0x4CAF50);
                target.material.emissiveIntensity = 0.5;
            } else if (isStrategy) {
                target.material.color.setHex(0xFFD700);
                target.material.emissive.setHex(0xFFD700);
                target.material.emissiveIntensity = 0.5;
            } else {
                target.material.color.setHex(0x666666);
                target.material.emissive.setHex(0x333333);
                target.material.emissiveIntensity = 0.2;
            }

            // Position
            const angle = Math.random() * Math.PI * 2;
            const radius = 7 + Math.random() * 5;
            const height = -3 + Math.random() * 9;

            target.position.set(
                Math.cos(angle) * radius,
                height,
                Math.sin(angle) * radius - 10
            );

            // OPTIMIZED: Use cached texture
            const sprite = target.userData.sprite;
            sprite.material.map = getNumberTexture(number);
            sprite.material.needsUpdate = true;
            sprite.position.set(0, 0.2, 1.2);  // Position in front of balloon
            sprite.scale.set(2.0, 2.0, 1);  // Larger number

            target.userData = {
                number,
                isAnswer,
                isStrategy,
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.015,
                    0.012 + Math.random() * 0.008,
                    (Math.random() - 0.5) * 0.008
                ),
                sprite,
                pulsePhase: Math.random() * Math.PI * 2
            };

            target.visible = true;
            target.scale.set(1.0, 1.2, 1.0);  // Bigger balloons
            STATE.targets.push(target);

            return target;
        }

        function spawnTargets() {
            // Release old targets (preserve sprite reference)
            STATE.targets.forEach(t => {
                t.visible = false;
                const sprite = t.userData.sprite;
                t.userData = { sprite };  // Keep sprite reference
            });
            STATE.targets = [];

            if (!STATE.currentQuestion) return;

            const { answer, strategy, allNumbers } = STATE.currentQuestion;

            allNumbers.forEach(num => {
                const isAnswer = num === answer;
                const isStrategy = strategy.includes(num) && !isAnswer;
                createTarget(num, isAnswer, isStrategy);
            });
        }

        function updateTargets(deltaTime) {
            const time = performance.now() * 0.001;

            STATE.targets.forEach(target => {
                if (!target.visible || !target.userData.velocity) return;

                target.position.add(target.userData.velocity);
                target.rotation.y += 0.012;

                // Boundary checks
                if (Math.abs(target.position.x) > 13) target.userData.velocity.x *= -1;
                if (target.position.y > 7) target.position.y = -4;
                else if (target.position.y < -5) target.position.y = 7;
                if (target.position.z > 4 || target.position.z < -18) target.userData.velocity.z *= -1;

                // Visual effects
                if (target.userData.isStrategy) {
                    const pulse = Math.sin(time * 4 + target.userData.pulsePhase) * 0.5 + 0.5;
                    target.material.emissiveIntensity = 0.4 + pulse * 0.5;
                    const s = 1 + pulse * 0.15;
                    target.scale.set(1.0 * s, 1.2 * s, 1.0 * s);
                } else if (target.userData.isAnswer) {
                    const glow = Math.sin(time * 2) * 0.15 + 0.5;
                    target.material.emissiveIntensity = glow;
                    target.scale.set(1.0, 1.2, 1.0);
                } else {
                    target.scale.set(1.0, 1.2, 1.0);
                }
            });
        }

        async function initMediaPipe() {

                updateLoadingProgress(20, 'Requesting camera...');

                STATE.videoElement = document.getElementById('hiddenVideo');

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 320 }, height: { ideal: 240 } }
                });

                updateLoadingProgress(50, 'Loading hand model...');

                STATE.hands = new Hands({

                });

                STATE.hands.setOptions({
                    maxNumHands: 1,

                    minDetectionConfidence: 0.6,
                    minTrackingConfidence: 0.5
                });

                STATE.hands.onResults(onHandsResults);

                updateLoadingProgress(100, 'Ready!');
                STATE.modelReady = true;

        // ============================================
        // HAND GESTURE FSM - FLICK UP TO SHOOT
        // Thumb up + Index extended = Aim
        // Quick upward flick = Fire
        // ============================================
        let prevIndexY = 0.5;
        let flickVelocity = 0;
        const FLICK_THRESHOLD = 0.025;  // How fast the upward movement needs to be

        function updateHandGestures() {
            const now = performance.now();

            if (!STATE.handsData || STATE.handsData.length === 0) {
                STATE.handState.state = 'idle';
                if (STATE.crosshair) STATE.crosshair.visible = false;
                updateHandStatus(false);
                prevIndexY = 0.5;
                flickVelocity = 0;
                return;
            }

            // Hand detected!
            updateHandStatus(true);

            const landmarks = STATE.handsData[0];

            // Thumb landmarks
            const thumbTip = landmarks[4];
            const thumbMCP = landmarks[2];

            // Index finger landmarks
            const indexTip = landmarks[8];
            const indexPIP = landmarks[6];

            // Check if thumb is extended (pointing up/out) - RELAXED condition
            const thumbLength = Math.sqrt(
                Math.pow(thumbTip.x - thumbMCP.x, 2) +
                Math.pow(thumbTip.y - thumbMCP.y, 2)
            );
            const isThumbUp = thumbLength > 0.06;

            // Check index finger extension
            const indexLength = Math.sqrt(
                Math.pow(indexTip.x - indexPIP.x, 2) +
                Math.pow(indexTip.y - indexPIP.y, 2) +
                Math.pow(indexTip.z - indexPIP.z, 2)
            );
            const isIndexExtended = indexLength > 0.06;

            // Gun gesture: thumb up is required
            const isGunPose = isThumbUp;

            // Detect flick up (Y decreases when moving up in screen coordinates)
            const currentY = indexTip.y;
            flickVelocity = prevIndexY - currentY;  // Positive = moving up
            prevIndexY = currentY;

            const isFlickUp = flickVelocity > FLICK_THRESHOLD;

            // Mirror mode crosshair position (use index tip for aiming)
            const worldX = -(indexTip.x - 0.5) * 28;
            const worldY = -(indexTip.y - 0.5) * 20 + 2;
            const worldZ = 0;

            // ALWAYS show crosshair when hand is detected
            updateCrosshairPosition(worldX, worldY, worldZ);
            if (STATE.crosshair) {
                STATE.crosshair.visible = true;
                // Change color based on state
                if (isGunPose && isIndexExtended) {
                    setCrosshairColor(0x00ff00);  // Green - ready to fire
                } else if (isGunPose) {
                    setCrosshairColor(0xffff00);  // Yellow
                } else {
                    setCrosshairColor(0x888888);  // Gray
                }
            }

            switch (STATE.handState.state) {
                case 'idle':
                    if (isGunPose && isIndexExtended) STATE.handState.state = 'ready';
                    break;

                case 'ready':
                    // Fire when quick upward flick detected
                    if (isGunPose && isFlickUp) {
                        STATE.handState.state = 'fired';
                        fireShot();
                    } else if (!isGunPose) {
                        STATE.handState.state = 'idle';
                    }
                    break;

                case 'fired':
                    STATE.handState.state = 'cooldown';
                    STATE.handState.cooldownEnd = now + CONFIG.GESTURE.COOLDOWN_MS;
                    break;

                case 'cooldown':
                    if (now >= STATE.handState.cooldownEnd) {
                        if (isGunPose && isIndexExtended) {
                            STATE.handState.state = 'ready';
                        } else if (isGunPose) {
                            STATE.handState.state = 'ready';
                        } else {
                            STATE.handState.state = 'idle';
                        }
                    }
                    break;
            }
        }

        // Show hand tracking status
        function updateHandStatus(detected) {
            let status = document.getElementById('handStatus');
            if (!status) {
                status = document.createElement('div');
                status.id = 'handStatus';
                status.style.cssText = 'position:fixed;bottom:20px;left:20px;padding:10px 15px;border-radius:8px;font-size:14px;font-weight:bold;z-index:1000;';
                document.body.appendChild(status);
            }
            if (detected) {
                status.textContent = '✋ 手を検出中';
                status.style.background = 'rgba(0,255,0,0.8)';
                status.style.color = '#000';
            } else {
                status.textContent = '👆 手を見せてね';
                status.style.background = 'rgba(255,100,100,0.8)';
                status.style.color = '#fff';
            }
        }

        function fireShot() {
            playSFX('shoot');
            STATE.player.shots++;

            // Change crosshair to RED when firing
            setCrosshairColor(0xff0000);
            setTimeout(() => setCrosshairColor(0x00ff00), 200);  // Back to green

            // Create muzzle flash effect
            createMuzzleFlash();

            // Small screen shake for shooting
            triggerScreenShake(0.15);

            // Raycast from camera through crosshair position
            const raycaster = new THREE.Raycaster();

            // Convert world position to NDC (-1 to 1)
            const crosshairWorld = new THREE.Vector3(
                STATE.crosshairCurrentPos.x,
                STATE.crosshairCurrentPos.y,
                STATE.crosshairCurrentPos.z
            );
            const ndc = crosshairWorld.clone().project(STATE.camera);

            raycaster.setFromCamera(new THREE.Vector2(ndc.x, ndc.y), STATE.camera);

            const intersects = raycaster.intersectObjects(STATE.targets.filter(t => t.visible));

            if (intersects.length > 0) {
                handleHit(intersects[0].object);
            } else {
                showFeedback('MISS', '#888');
                playSFX('miss');
            }
        }

        function handleHit(target) {
            const { isAnswer, isStrategy, number } = target.userData;

            // Store position before hiding
            const hitPosition = target.position.clone();

            // Hide target
            target.visible = false;
            STATE.targets = STATE.targets.filter(t => t !== target);

            STATE.player.hits++;

            // Explosion effect
            createExplosion(hitPosition, isAnswer ? 0x4CAF50 : isStrategy ? 0xFFD700 : 0xff4444);

            // Crosshair pulse on hit
            pulseCrosshair();

            if (isAnswer) {
                STATE.player.score += CONFIG.SCORE_CORRECT;
                STATE.player.streak++;
                STATE.player.bestStreak = Math.max(STATE.player.bestStreak, STATE.player.streak);

                showFeedback(`+${CONFIG.SCORE_CORRECT}`, '#4CAF50');
                showFloatingScore(hitPosition, `+${CONFIG.SCORE_CORRECT}`, '#4CAF50');
                showCombo(STATE.player.streak);
                playSFX('correct');
                playComboSound(STATE.player.streak);

                // VFX: Screen shake and background flash for correct answer
                triggerScreenShake(0.4);
                triggerBgFlash(0x1a3a1a);  // Green flash

                // Update streak fire effect
                createStreakFire();

                if (STATE.player.streak >= 5 && STATE.difficultyLevel < 4) {
                    STATE.difficultyLevel++;
                    showStrategyHint('Level UP!');
                    playLevelUpSound();
                }

                nextQuestion();

            } else if (isStrategy) {
                STATE.player.score += CONFIG.SCORE_SMART;
                STATE.player.streak++;
                STATE.player.bestStreak = Math.max(STATE.player.bestStreak, STATE.player.streak);

                showFeedback(`SMART +${CONFIG.SCORE_SMART}`, '#FFD700');
                showFloatingScore(hitPosition, `SMART! +${CONFIG.SCORE_SMART}`, '#FFD700');
                showCombo(STATE.player.streak);
                playSFX('smart');
                playComboSound(STATE.player.streak);

                // VFX: Golden flash for smart hit
                triggerScreenShake(0.3);
                triggerBgFlash(0x2a2a0a);  // Golden flash

                // Update streak fire effect
                createStreakFire();

                // Show learning hint
                if (STATE.currentQuestion.hint) {
                    showStrategyHint(STATE.currentQuestion.hint);
                }

            } else {
                STATE.player.score = Math.max(0, STATE.player.score - CONFIG.PENALTY_WRONG);
                STATE.player.streak = Math.max(0, STATE.player.streak - 1);

                showFeedback(`-${CONFIG.PENALTY_WRONG}`, '#ff4444');
                showFloatingScore(hitPosition, `-${CONFIG.PENALTY_WRONG}`, '#ff4444');
                playSFX('wrong');

                // VFX: Red flash for wrong answer
                triggerScreenShake(0.5);
                triggerBgFlash(0x3a0a0a);  // Red flash

                // Reset streak fire
                const scoreEl = document.getElementById('playerScore');
                if (scoreEl) {
                    scoreEl.style.boxShadow = '';
                    scoreEl.style.textShadow = '';
                }

                if (STATE.player.streak === 0 && STATE.difficultyLevel > 1) {
                    STATE.difficultyLevel--;
                }
            }

            updateHUD();
        }

        // ============================================
        // VFX SYSTEM (ENHANCED)
        // ============================================

        // Screen shake state
        let screenShake = { intensity: 0, decay: 0.9 };

        function triggerScreenShake(intensity) {
            screenShake.intensity = Math.max(screenShake.intensity, intensity);
        }

        function updateScreenShake() {
            if (screenShake.intensity > 0.01) {
                const shakeX = (Math.random() - 0.5) * screenShake.intensity;
                const shakeY = (Math.random() - 0.5) * screenShake.intensity;
                STATE.camera.position.x = shakeX;
                STATE.camera.position.y = 2 + shakeY;
                screenShake.intensity *= screenShake.decay;
            } else {
                STATE.camera.position.x = 0;
                STATE.camera.position.y = 2;
                screenShake.intensity = 0;
            }
        }

        // Background flash
        let bgFlash = { active: false, color: 0x0a0a1a, targetColor: 0x0a0a1a, speed: 0.1 };

        function triggerBgFlash(color) {
            bgFlash.active = true;
            bgFlash.color = color;
            setTimeout(() => {
                bgFlash.active = false;
            }, 150);
        }

        function updateBgFlash() {
            if (bgFlash.active) {
                STATE.scene.background.setHex(bgFlash.color);
            } else {
                // Lerp back to original
                STATE.scene.background.lerp(new THREE.Color(0x0a0a1a), 0.15);
            }
        }

        // Muzzle flash effect
        function createMuzzleFlash() {
            if (!STATE.crosshair || !STATE.crosshair.visible) return;

            // Create multiple flash particles
            for (let i = 0; i < 5; i++) {
                const p = getParticle();
                if (!p) break;

                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 0.5;

                p.position.set(
                    STATE.crosshair.position.x + Math.cos(angle) * dist,
                    STATE.crosshair.position.y + Math.sin(angle) * dist,
                    STATE.crosshair.position.z + 0.5
                );

                // Yellow/orange flash colors
                const flashColors = [0xffff00, 0xff8800, 0xffaa00, 0xffffff];
                p.material.color.setHex(flashColors[Math.floor(Math.random() * flashColors.length)]);
                p.material.opacity = 1;
                p.scale.setScalar(0.3 + Math.random() * 0.4);

                p.userData = {
                    velocity: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.2,
                        (Math.random() - 0.5) * 0.2,
                        Math.random() * 0.3
                    ),
                    life: 0.3 + Math.random() * 0.2,
                    isFlash: true
                };

                p.visible = true;
                STATE.particles.push(p);
            }
        }

        // Enhanced explosion with more particles and variety
        function createExplosion(position, color) {
            const count = 15;  // More particles

            // Main explosion particles
            for (let i = 0; i < count; i++) {
                const p = getParticle();
                if (!p) break;

                p.position.copy(position);

                // Vary colors slightly
                const colorObj = new THREE.Color(color);
                colorObj.offsetHSL(0, (Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.3);
                p.material.color.copy(colorObj);
                p.material.opacity = 1;

                const size = 0.4 + Math.random() * 0.8;
                p.scale.setScalar(size);

                // Explosive outward velocity
                const speed = 0.2 + Math.random() * 0.4;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;

                p.userData = {
                    velocity: new THREE.Vector3(
                        Math.sin(phi) * Math.cos(theta) * speed,
                        Math.sin(phi) * Math.sin(theta) * speed + 0.1,
                        Math.cos(phi) * speed
                    ),
                    life: 0.8 + Math.random() * 0.5,
                    initialSize: size,
                    hasTrail: Math.random() > 0.5
                };

                p.visible = true;
                STATE.particles.push(p);
            }

            // Ring shockwave effect
            createShockwave(position, color);
        }

        // Shockwave ring effect
        function createShockwave(position, color) {
            const ringGeom = new THREE.RingGeometry(0.1, 0.3, 24);
            const ringMat = new THREE.MeshBasicMaterial({
                color: color,
                opacity: 0.8,
                transparent: true,
                side: THREE.DoubleSide
            });
            const ring = new THREE.Mesh(ringGeom, ringMat);
            ring.position.copy(position);
            ring.lookAt(STATE.camera.position);
            STATE.scene.add(ring);

            // Animate ring expansion
            let scale = 1;
            let opacity = 0.8;
            const animateRing = () => {
                scale += 0.4;
                opacity -= 0.08;
                ring.scale.setScalar(scale);
                ring.material.opacity = opacity;

                if (opacity > 0) {
                    requestAnimationFrame(animateRing);
                } else {
                    STATE.scene.remove(ring);
                    ring.geometry.dispose();
                    ring.material.dispose();
                }
            };
            requestAnimationFrame(animateRing);
        }

        // Crosshair pulse effect on hit
        function pulseCrosshair() {
            if (!STATE.crosshair) return;

            let pulseScale = 1.5;
            const animatePulse = () => {
                pulseScale -= 0.08;
                if (pulseScale > 1) {
                    STATE.crosshair.scale.setScalar(pulseScale);
                    requestAnimationFrame(animatePulse);
                } else {
                    STATE.crosshair.scale.setScalar(1);
                }
            };
            requestAnimationFrame(animatePulse);
        }

        // Streak fire particles around score
        function createStreakFire() {
            if (STATE.player.streak < 3) return;

            const scoreEl = document.getElementById('playerScore');
            if (!scoreEl) return;

            // Add fire glow effect
            const intensity = Math.min(STATE.player.streak / 10, 1);
            scoreEl.style.boxShadow = `0 0 ${20 + intensity * 30}px rgba(255, ${150 - intensity * 100}, 0, ${0.5 + intensity * 0.5})`;
            scoreEl.style.textShadow = `0 0 10px rgba(255, ${200 - intensity * 100}, 0, 1)`;
        }

        // Show floating score at world position
        function showFloatingScore(worldPos, text, color) {
            // Project 3D position to screen
            const screenPos = worldPos.clone().project(STATE.camera);
            const x = (screenPos.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-screenPos.y * 0.5 + 0.5) * window.innerHeight;

            const div = document.createElement('div');
            div.className = 'floating-score';
            div.textContent = text;
            div.style.left = `${x}px`;
            div.style.top = `${y}px`;
            div.style.color = color;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 1000);
        }

        // Show combo display
        function showCombo(streak) {
            if (streak < 2) return;

            document.querySelectorAll('.combo-display').forEach(d => d.remove());

            const div = document.createElement('div');
            div.className = 'combo-display';
            div.textContent = `${streak}x COMBO!`;

            if (streak >= 10) {
                div.style.color = '#FF0000';
                div.style.fontSize = '4rem';
                div.textContent = `🔥 ${streak}x COMBO! 🔥`;
            } else if (streak >= 5) {
                div.style.color = '#FF8C00';
                div.style.fontSize = '3.5rem';
            }

            document.body.appendChild(div);
            setTimeout(() => div.remove(), 1500);
        }

        function updateParticles(deltaTime) {
            STATE.particles = STATE.particles.filter(p => {
                if (!p.userData) return false;

                p.position.add(p.userData.velocity);

                // Gravity (less for flash particles)
                if (!p.userData.isFlash) {
                    p.userData.velocity.y -= 0.015;
                }

                p.userData.life -= deltaTime * (p.userData.isFlash ? 8 : 2.5);
                p.material.opacity = Math.max(0, p.userData.life);

                // Size animation
                const lifeRatio = p.userData.life / (p.userData.initialSize || 1);
                p.scale.setScalar((p.userData.initialSize || 0.8) * Math.max(0.1, lifeRatio));

                if (p.userData.life <= 0) {
                    p.visible = false;
                    return false;
                }
                return true;
            });
        }

        // ============================================
        // UI SYSTEM
        // ============================================
        function showOverlay(id) {
            document.querySelectorAll('.overlay').forEach(o => o.classList.add('hidden'));
            document.getElementById(id)?.classList.remove('hidden');
        }

        function hideAllOverlays() {
            document.querySelectorAll('.overlay').forEach(o => o.classList.add('hidden'));
        }

        function showFeedback(text, color) {
            document.querySelectorAll('.feedback').forEach(f => f.remove());
            const div = document.createElement('div');
            div.className = 'feedback';
            div.textContent = text;
            div.style.color = color;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 600);
        }

        function showStrategyHint(text) {
            document.querySelectorAll('.strategy-hint').forEach(h => h.remove());
            const div = document.createElement('div');
            div.className = 'strategy-hint';
            div.textContent = text;
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 2000);
        }

        function updateHUD() {
            document.getElementById('questionCount').textContent = `${STATE.questionIndex + 1}/${CONFIG.QUESTIONS_PER_ROUND}`;
            document.getElementById('timeDisplay').textContent = `${Math.ceil(Math.max(0, STATE.timeLeft))}s`;

            const p = STATE.player;
            p.accuracy = p.shots > 0 ? Math.round((p.hits / p.shots) * 100) : 0;

            const scoreEl = document.getElementById('playerScore');
            scoreEl.textContent = `${p.score} pts | 🔥${p.streak} | 🎯${p.accuracy}%`;

            if (p.streak >= 5) {
                scoreEl.classList.add('streak-glow');
            } else {
                scoreEl.classList.remove('streak-glow');
            }

            if (STATE.currentQuestion) {
                document.getElementById('questionDisplay').textContent = STATE.currentQuestion.question;
            }
        }

        function nextQuestion() {
            STATE.questionIndex++;

            if (STATE.questionIndex >= CONFIG.QUESTIONS_PER_ROUND) {
                endRound();
                return;
            }

            STATE.currentQuestion = generateQuestion();
            spawnTargets();
            updateHUD();
        }

        function endRound() {
            STATE.isRunning = false;
            saveBestScores();
            showRanking();
        }

        function saveBestScores() {
            try {
                const scores = JSON.parse(localStorage.getItem('mathShootingBest') || '[]');
                scores.push({
                    score: STATE.player.score,
                    streak: STATE.player.bestStreak,
                    accuracy: STATE.player.accuracy,
                    date: new Date().toLocaleDateString()
                });
                scores.sort((a, b) => b.score - a.score);
                localStorage.setItem('mathShootingBest', JSON.stringify(scores.slice(0, 20)));
                STATE.bestScores = scores;
            } catch (e) {}
        }

        function showRanking() {
            const ranking = document.getElementById('rankingDisplay');
            ranking.innerHTML = '';

            const current = {
                score: STATE.player.score,
                streak: STATE.player.bestStreak,
                accuracy: STATE.player.accuracy,
                current: true
            };

            const all = [current, ...STATE.bestScores.slice(0, 4)];

            all.forEach((p, i) => {
                const entry = document.createElement('div');
                entry.className = `ranking-entry rank-${i + 1}`;
                if (p.current) entry.classList.add('current');

                const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}.`;
                entry.innerHTML = `<span>${medal} ${p.current ? 'NOW' : p.date || ''}</span><span>${p.score}pts 🔥${p.streak} 🎯${p.accuracy}%</span>`;
                ranking.appendChild(entry);
            });

            showOverlay('rankingOverlay');
        }

        // ============================================
        // GAME LOOP (OPTIMIZED)
        // ============================================
        let frameCount = 0;
        function gameLoop(timestamp) {
            if (!STATE.isRunning || STATE.isPaused) {
                if (STATE.isRunning) requestAnimationFrame(gameLoop);
                return;
            }

            // Debug: log first few frames
            if (frameCount < 3) {
                console.log('[GameLoop] Frame', frameCount, 'targets:', STATE.targets.length);
                frameCount++;
            }

            const deltaTime = Math.min((timestamp - STATE.lastRenderTime) / 1000, 0.1);
            STATE.lastRenderTime = timestamp;

            const elapsed = (timestamp - STATE.gameStartTime) / 1000;
            STATE.timeLeft = Math.max(0, CONFIG.TIME_LIMIT - elapsed);

            if (STATE.timeLeft <= 0) {
                endRound();
                return;
            }

            // Update all systems
            updateTargets(deltaTime);
            updateParticles(deltaTime);
            interpolateCrosshair();
            updateScreenShake();
            updateBgFlash();
            updateHUD();

            // Render
            if (STATE.renderer && STATE.scene && STATE.camera) {
                STATE.renderer.render(STATE.scene, STATE.camera);
            }
            requestAnimationFrame(gameLoop);
        }

        // OPTIMIZED: Use RAF for detection too
        let lastDetection = 0;
        const detectionInterval = 1000 / CONFIG.DETECTION_FPS;

        function detectionLoop(timestamp) {
            if (!STATE.isRunning || STATE.isPaused || !STATE.modelReady) {
                if (STATE.isRunning) requestAnimationFrame(detectionLoop);
                return;
            }

            if (timestamp - lastDetection >= detectionInterval) {
                STATE.hands.send({ image: STATE.videoElement }).then(() => {
                    updateHandGestures();
                }).catch(e => console.warn('Detection error:', e));
                lastDetection = timestamp;
            }

            requestAnimationFrame(detectionLoop);
        }

        // ============================================
        // GAME LIFECYCLE
        // ============================================
        async function startGame() {
            try {
                console.log('[Game] Starting...');

                // Initialize 3D scene first (always needed)
                if (!STATE.scene) {
                    console.log('[Game] Initializing Three.js...');
                    initThreeJS();
                }

                // Show HUD and render first frame immediately
                document.getElementById('hud').classList.remove('hidden');
                hideAllOverlays();

                // Initialize audio (non-blocking)
                if (!STATE.audioContext) {
                    initAudio().catch(e => console.warn('Audio init failed:', e));
                }

                // Reset game state
                STATE.questionIndex = 0;
                STATE.timeLeft = CONFIG.TIME_LIMIT;
                STATE.difficultyLevel = 1;
                STATE.handState = { state: 'idle', cooldownEnd: 0 };

                STATE.player.score = 0;
                STATE.player.streak = 0;
                STATE.player.bestStreak = 0;
                STATE.player.accuracy = 0;
                STATE.player.shots = 0;
                STATE.player.hits = 0;

                // Generate question and spawn targets
                STATE.currentQuestion = generateQuestion();
                console.log('[Game] Question:', STATE.currentQuestion);
                spawnTargets();
                updateHUD();

                // Start game loop immediately (renders 3D scene)
                STATE.isRunning = true;
                STATE.isPaused = false;
                STATE.gameStartTime = performance.now();
                STATE.lastRenderTime = STATE.gameStartTime;

                console.log('[Game] Starting game loop...');
                requestAnimationFrame(gameLoop);

                // Initialize MediaPipe in background (non-blocking)
                if (!STATE.modelReady) {
                    console.log('[Game] Initializing MediaPipe in background...');
                    initMediaPipe().then(() => {
                        console.log('[Game] MediaPipe ready, starting detection loop');
                        requestAnimationFrame(detectionLoop);
                    }).catch(error => {
                        console.error('[Game] MediaPipe failed:', error);
                        showStrategyHint('カメラを許可してください');
                    });
                } else {
                    requestAnimationFrame(detectionLoop);
                }

            } catch (error) {
                console.error('[Game] Fatal error:', error);
                document.getElementById('errorMessage').textContent = error.message;
                showOverlay('errorOverlay');
            }
        }

        function nextRound() {
            startGame();
        }

        // ============================================
        // PAGE VISIBILITY
        // ============================================
        document.addEventListener('visibilitychange', () => {
            STATE.isPaused = document.hidden;
            if (STATE.audioContext) {
                document.hidden ? STATE.audioContext.suspend() : STATE.audioContext.resume();
            }
        });

        // ============================================
        // INITIALIZATION
        // ============================================
        window.addEventListener('load', () => {
            try {
                STATE.bestScores = JSON.parse(localStorage.getItem('mathShootingBest') || '[]');
            } catch (e) {
                STATE.bestScores = [];
            }

            // Setup audio unlock (browsers require user interaction)
            setupAudioUnlock();

            // Auto-start
            setTimeout(startGame, 50);
        });

        // Prevent scroll/zoom
        document.body.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

        // ============================================
        // TOUCH/CLICK CONTROLS (FALLBACK)
        // ============================================
        function handlePointerShoot(clientX, clientY) {
            if (!STATE.isRunning || STATE.isPaused) return;

            console.log('[Touch] Tap at', clientX, clientY);

            // Convert screen position to NDC (-1 to 1)
            const ndcX = (clientX / window.innerWidth) * 2 - 1;
            const ndcY = -(clientY / window.innerHeight) * 2 + 1;

            // Direct raycast from screen position
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), STATE.camera);

            // Show crosshair at ray intersection point
            const rayDir = raycaster.ray.direction.clone();
            const rayOrigin = raycaster.ray.origin.clone();
            const targetZ = -10;  // Where balloons are
            const t = (targetZ - rayOrigin.z) / rayDir.z;
            const hitPoint = rayOrigin.add(rayDir.multiplyScalar(t));

            // Move and show crosshair
            if (STATE.crosshair) {
                STATE.crosshair.position.set(hitPoint.x, hitPoint.y, targetZ + 2);
                STATE.crosshair.visible = true;
                STATE.crosshair.lookAt(STATE.camera.position);
                setCrosshairColor(0xff0000);  // Red when shooting
            }

            // Play sound
            playSFX('shoot');
            STATE.player.shots++;

            // Check for hits
            const intersects = raycaster.intersectObjects(STATE.targets.filter(t => t.visible), true);

            console.log('[Touch] Intersects:', intersects.length);

            if (intersects.length > 0) {
                // Find the balloon (parent of sprite if we hit sprite)
                let target = intersects[0].object;
                while (target.parent && !STATE.targets.includes(target)) {
                    target = target.parent;
                }
                if (STATE.targets.includes(target)) {
                    handleHit(target);
                } else {
                    showFeedback('MISS', '#888');
                    playSFX('miss');
                }
            } else {
                showFeedback('MISS', '#888');
                playSFX('miss');
            }

            // Hide crosshair after a moment
            setTimeout(() => {
                if (STATE.crosshair) {
                    setCrosshairColor(0x00ff00);  // Back to green
                    if (!STATE.modelReady) {
                        STATE.crosshair.visible = false;
                    }
                }
            }, 200);
        }

        // Touch support
        document.getElementById('gameCanvas').addEventListener('touchstart', e => {
            e.preventDefault();
            const touch = e.touches[0];
            handlePointerShoot(touch.clientX, touch.clientY);
        }, { passive: false });

        // Mouse/click support
        document.getElementById('gameCanvas').addEventListener('click', e => {
            handlePointerShoot(e.clientX, e.clientY);
        });

        // Prevent double-tap zoom
        let lastTap = 0;
        document.addEventListener('touchend', e => {
            const now = Date.now();
            if (now - lastTap < 300) e.preventDefault();
            lastTap = now;
        });
    </script>
</body>
</html>
