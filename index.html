<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Math Shooting Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background: #000;
            touch-action: none;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }

        /* NEVER DISPLAY CAMERA */
        #hiddenVideo {
            position: absolute;
            top: -9999px;
            left: -9999px;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            transition: opacity 0.3s;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }

        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .overlay h1 {
            color: #fff;
            font-size: 2.5rem;
            margin-bottom: 1rem;
            text-align: center;
            padding: 0 1rem;
        }

        .overlay p {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 2rem;
            text-align: center;
            padding: 0 1rem;
            max-width: 600px;
            line-height: 1.5;
        }

        .btn {
            padding: 1rem 2rem;
            margin: 0.5rem;
            font-size: 1.2rem;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: bold;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: scale(0.95);
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 1.5rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .progress-bar {
            width: 80%;
            max-width: 400px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s;
        }

        /* MINIMAL HUD */
        #hud {
            position: fixed;
            top: env(safe-area-inset-top, 0);
            left: env(safe-area-inset-left, 0);
            right: env(safe-area-inset-right, 0);
            padding: 1rem;
            z-index: 100;
            color: white;
            pointer-events: none;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
            gap: 0.5rem;
        }

        .hud-item {
            background: rgba(0, 0, 0, 0.85);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            backdrop-filter: blur(10px);
        }

        .player-scores {
            display: flex;
            gap: 0.5rem;
            flex: 1;
            justify-content: space-around;
        }

        .player-score {
            background: rgba(0, 0, 0, 0.85);
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            border: 3px solid;
            backdrop-filter: blur(10px);
        }

        .player-score.p1 {
            border-color: #ff4444;
        }

        .player-score.p2 {
            border-color: #44ff44;
        }

        /* QUESTION DISPLAY - NO HINTS, JUST THE QUESTION */
        .question-display {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.95), rgba(118, 75, 162, 0.95));
            padding: 1.2rem 2.5rem;
            border-radius: 16px;
            font-size: 2.5rem;
            text-align: center;
            margin: 1rem auto;
            max-width: 90%;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            font-weight: bold;
            backdrop-filter: blur(10px);
        }

        .streak-glow {
            animation: streakPulse 1.5s infinite;
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
        }

        @keyframes streakPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(255, 215, 0, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(255, 215, 0, 1); }
        }

        /* FEEDBACK - PLAYER-SPECIFIC */
        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 4rem;
            font-weight: bold;
            z-index: 500;
            pointer-events: none;
            animation: feedbackPop 0.8s ease-out;
            text-shadow:
                0 0 10px rgba(0, 0, 0, 1),
                0 0 20px rgba(0, 0, 0, 0.8),
                0 0 40px rgba(0, 0, 0, 0.6);
        }

        @keyframes feedbackPop {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            40% { transform: translate(-50%, -50%) scale(1.3); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
        }

        /* RANKING SCREEN */
        .ranking {
            background: rgba(0, 0, 0, 0.95);
            padding: 2rem;
            border-radius: 20px;
            max-width: 90%;
            max-height: 70vh;
            overflow-y: auto;
            backdrop-filter: blur(15px);
        }

        .ranking-entry {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            margin-bottom: 0.8rem;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            transition: transform 0.2s;
        }

        .ranking-entry:hover {
            transform: scale(1.02);
        }

        .ranking-entry.rank-1 {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #000;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .ranking-entry.rank-2 {
            background: linear-gradient(135deg, #C0C0C0 0%, #808080 100%);
            color: #000;
        }

        .ranking-entry.rank-3 {
            background: linear-gradient(135deg, #CD7F32 0%, #8B4513 100%);
            color: #fff;
        }

        .ranking-entry.current {
            border: 3px solid #667eea;
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.6);
        }

        @media (max-width: 480px) {
            .overlay h1 { font-size: 2rem; }
            .question-display { font-size: 2rem; padding: 1rem 2rem; }
            .feedback { font-size: 3rem; }
            .hud-item { font-size: 0.95rem; padding: 0.5rem 1rem; }
        }
    </style>
</head>
<body>
    <!-- HIDDEN VIDEO - NEVER DISPLAYED -->
    <video id="hiddenVideo" playsinline autoplay muted></video>

    <!-- Three.js Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- MINIMAL HUD -->
    <div id="hud" class="hidden">
        <div class="hud-row">
            <div class="hud-item">📊 <span id="questionCount">0</span>/10</div>
            <div class="hud-item">⏱️ <span id="timeDisplay">60</span>s</div>
        </div>
        <div class="hud-row player-scores" id="playerScores"></div>
        <div class="question-display" id="questionDisplay">?</div>
    </div>

    <!-- Start Overlay -->
    <div id="startOverlay" class="overlay">
        <h1>🎯 Math Shooting!</h1>
        <p>
            Shoot numbers with hand gestures!<br>
            Make a pistol: 👉 point finger, thumb up.<br>
            <small>Camera needed (never shown)</small>
        </p>
        <div class="btn-group">
            <button class="btn" onclick="startGame('solo')">🎮 Solo</button>
            <button class="btn" onclick="startGame('duo')">👥 2-Player</button>
            <button class="btn" onclick="startGame('party')">🎉 Party</button>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="overlay hidden">
        <div class="spinner"></div>
        <h1>Loading...</h1>
        <p id="loadingText">Initializing hand tracking</p>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <!-- Error Overlay -->
    <div id="errorOverlay" class="overlay hidden">
        <h1>⚠️ Oops!</h1>
        <p id="errorMessage">Something went wrong</p>
        <button class="btn" onclick="retryGame()">🔄 Retry</button>
    </div>

    <!-- Ranking Overlay -->
    <div id="rankingOverlay" class="overlay hidden">
        <h1>🏆 Results!</h1>
        <div class="ranking" id="rankingDisplay"></div>
        <div class="btn-group">
            <button class="btn" onclick="nextRound()">▶️ Next Round</button>
            <button class="btn" onclick="backToMenu()">🏠 Menu</button>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- MediaPipe Hands - PINNED VERSION 0.4.1646424915 (CRITICAL) -->
    <script src="https://unpkg.com/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>

    <script>
        'use strict';

        // ============================================
        // GLOBAL STATE
        // ============================================
        const STATE = {
            // Three.js
            scene: null,
            camera: null,
            renderer: null,

            // MediaPipe
            hands: null,
            videoElement: null,
            handsData: [],

            // Audio
            audioContext: null,
            audioBuffers: {},

            // Game mode
            gameMode: 'solo',

            // Players
            players: [
                { name: 'P1', score: 0, streak: 0, accuracy: 0, shots: 0, hits: 0, bestStreak: 0 },
                { name: 'P2', score: 0, streak: 0, accuracy: 0, shots: 0, hits: 0, bestStreak: 0 }
            ],

            // Game state
            timeLeft: 60,
            questionIndex: 0,
            currentQuestion: null,
            difficultyLevel: 1, // Adaptive difficulty

            // Object pools
            targetPool: [],
            particlePool: [],
            targets: [],
            particles: [],
            lasers: [null, null],

            // Hand tracking (max 2 hands)
            handStates: [
                { state: 'idle', handedness: null, lastPos: null, cooldownEnd: 0, landmarkIndex: null },
                { state: 'idle', handedness: null, lastPos: null, cooldownEnd: 0, landmarkIndex: null }
            ],

            // Timing
            lastDetectionTime: 0,
            detectionInterval: 1000 / 15, // 15 FPS - Faster response
            gameStartTime: 0,
            lastRenderTime: 0,

            // Flags
            isRunning: false,
            isPaused: false,
            modelReady: false,
            audioReady: false,

            // Best scores (localStorage)
            bestScores: []
        };

        // ============================================
        // CONFIGURATION
        // ============================================
        const CONFIG = {
            // Gesture FSM with hysteresis
            GESTURE: {
                ARM_THRESHOLD: 0.08,
                FIRE_THRESHOLD: 0.15,
                HYSTERESIS: 0.02,
                V_MIN_THUMB: 0.015,
                COOLDOWN_MS: 250
            },

            // Performance - OPTIMIZED FOR MOBILE
            MAX_TARGETS: 5,
            TARGET_POOL_SIZE: 10,
            PARTICLE_POOL_SIZE: 30,

            // Game
            QUESTIONS_PER_ROUND: 10,
            TIME_LIMIT: 60,

            // Scoring
            SCORE_CORRECT: 100,
            SCORE_SMART: 50,
            PENALTY_WRONG: 20,

            // Adaptive difficulty
            DIFFICULTY_LEVELS: {
                1: { range: [0, 10], distractorCount: 3 },
                2: { range: [0, 15], distractorCount: 4 },
                3: { range: [0, 20], distractorCount: 5 },
                4: { range: [0, 20], distractorCount: 6 }
            }
        };

        // ============================================
        // MATH QUESTION GENERATOR (NO TEXT HINTS)
        // ============================================
        const QUESTION_TEMPLATES = [
            // ===== ADDITION: Make-10 (0-20) =====
            {
                type: 'addition_make10',
                difficulty: 1,
                generate: () => {
                    const a = 7 + Math.floor(Math.random() * 3); // 7-9
                    const toTen = 10 - a;
                    const extra = 1 + Math.floor(Math.random() * Math.min(5, 20 - 10));
                    const b = toTen + extra;
                    const answer = a + b;
                    const strategy = [10]; // Intermediate: 10

                    return {
                        question: `${a} + ${b}`,
                        answer,
                        strategy
                    };
                }
            },

            // ===== SUBTRACTION: Count-up (0-20) =====
            {
                type: 'subtraction_countup',
                difficulty: 2,
                generate: () => {
                    const answer = 3 + Math.floor(Math.random() * 8);
                    const a = 10 + Math.floor(Math.random() * 10);
                    const b = a - answer;
                    const strategy = [answer]; // The gap

                    return {
                        question: `${a} − ${b}`,
                        answer,
                        strategy
                    };
                }
            },

            // ===== MULTIPLICATION: Decomposition (1-9) =====
            {
                type: 'multiplication_decompose',
                difficulty: 3,
                generate: () => {
                    const a = 5 + Math.floor(Math.random() * 4); // 5-8
                    const b = 3 + Math.floor(Math.random() * 4); // 3-6

                    const part1 = 2;
                    const part2 = b - part1;

                    const step1 = a * part1;
                    const step2 = a * part2;
                    const answer = a * b;

                    const strategy = [step1, step2];

                    return {
                        question: `${a} × ${b}`,
                        answer,
                        strategy
                    };
                }
            },

            // ===== MULTIPLICATION: 9× shortcut =====
            {
                type: 'multiplication_9x',
                difficulty: 3,
                generate: () => {
                    const b = 3 + Math.floor(Math.random() * 6);
                    const step1 = 10 * b;
                    const step2 = b;
                    const answer = 9 * b;

                    const strategy = [step1, step2];

                    return {
                        question: `9 × ${b}`,
                        answer,
                        strategy
                    };
                }
            },

            // ===== INVERSE MULTIPLICATION (NO ÷ symbol) =====
            {
                type: 'inverse_multiplication',
                difficulty: 4,
                generate: () => {
                    const a = 3 + Math.floor(Math.random() * 5); // 3-7
                    const answer = 2 + Math.floor(Math.random() * 6); // 2-7
                    const b = a * answer;

                    const strategy = [answer];

                    return {
                        question: `${a} × ? = ${b}`,
                        answer,
                        strategy
                    };
                }
            }
        ];

        function generateQuestion() {
            // Filter by difficulty
            const available = QUESTION_TEMPLATES.filter(t => t.difficulty <= STATE.difficultyLevel);
            const template = available[Math.floor(Math.random() * available.length)];
            const q = template.generate();

            // Generate distractors based on difficulty
            const diffConfig = CONFIG.DIFFICULTY_LEVELS[STATE.difficultyLevel];
            const distractors = new Set();

            while (distractors.size < diffConfig.distractorCount) {
                const offset = Math.floor(Math.random() * 10) - 5;
                const distractor = Math.max(0, Math.min(diffConfig.range[1], q.answer + offset));
                if (distractor !== q.answer && !q.strategy.includes(distractor)) {
                    distractors.add(distractor);
                }
            }

            const allNumbers = [q.answer, ...q.strategy, ...Array.from(distractors)];
            const uniqueNumbers = [...new Set(allNumbers)].slice(0, CONFIG.MAX_TARGETS);

            if (!uniqueNumbers.includes(q.answer)) {
                uniqueNumbers[uniqueNumbers.length - 1] = q.answer;
            }

            return {
                ...q,
                allNumbers: uniqueNumbers
            };
        }

        // ============================================
        // AUDIO SYSTEM (PRELOADED, iOS-SAFE)
        // ============================================
        async function initAudio() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                STATE.audioContext = new AudioContext();

                if (STATE.audioContext.state === 'suspended') {
                    await STATE.audioContext.resume();
                }

                // Preload sounds
                await Promise.all([
                    createSound('shoot', [[200, 0.08, 'square']]),
                    createSound('correct', [[523, 0.15], [659, 0.15, 'sine', 80]]),
                    createSound('smart', [[659, 0.12], [784, 0.12, 'sine', 60], [880, 0.15, 'sine', 120]]),
                    createSound('wrong', [[180, 0.25]]),
                    createSound('miss', [[140, 0.12]])
                ]);

                STATE.audioReady = true;
            } catch (e) {
                console.warn('Web Audio not supported:', e);
            }
        }

        async function createSound(name, tones) {
            // For now, we'll use simple oscillators (can be replaced with loaded buffers)
            STATE.audioBuffers[name] = tones;
        }

        function playSFX(type) {
            if (!STATE.audioContext || !STATE.audioReady) return;

            try {
                const tones = STATE.audioBuffers[type];
                if (!tones) return;

                tones.forEach(([freq, duration, oscType = 'sine', delay = 0]) => {
                    setTimeout(() => {
                        const osc = STATE.audioContext.createOscillator();
                        const gain = STATE.audioContext.createGain();

                        osc.connect(gain);
                        gain.connect(STATE.audioContext.destination);

                        osc.frequency.value = freq;
                        osc.type = oscType;

                        const now = STATE.audioContext.currentTime;
                        gain.gain.setValueAtTime(0.15, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + duration);

                        osc.start(now);
                        osc.stop(now + duration);
                    }, delay);
                });
            } catch (e) {
                console.warn('Audio playback failed:', e);
            }
        }

        // ============================================
        // THREE.JS SCENE SETUP
        // ============================================
        function initThreeJS() {
            const canvas = document.getElementById('gameCanvas');

            STATE.scene = new THREE.Scene();
            STATE.scene.background = new THREE.Color(0x0a0a1a);
            // Fog removed for performance

            STATE.camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            STATE.camera.position.set(0, 2, 15);
            STATE.camera.lookAt(0, 0, 0);

            STATE.renderer = new THREE.WebGLRenderer({
                canvas,
                antialias: false, // Disabled for performance
                powerPreference: 'high-performance'
            });
            STATE.renderer.setSize(window.innerWidth, window.innerHeight);
            STATE.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); // Lower pixel ratio

            // Simplified lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            STATE.scene.add(ambientLight);

            // Single light instead of two
            const pointLight = new THREE.PointLight(0x667eea, 0.6, 50);
            pointLight.position.set(0, 10, 10);
            STATE.scene.add(pointLight);

            // Simplified grid
            const gridHelper = new THREE.GridHelper(40, 20, 0x667eea, 0x222233);
            gridHelper.position.y = -6;
            STATE.scene.add(gridHelper);

            initObjectPools();

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            STATE.camera.aspect = window.innerWidth / window.innerHeight;
            STATE.camera.updateProjectionMatrix();
            STATE.renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // ============================================
        // OBJECT POOLING
        // ============================================
        function initObjectPools() {
            for (let i = 0; i < CONFIG.TARGET_POOL_SIZE; i++) {
                const target = createTargetMesh();
                target.visible = false;
                STATE.scene.add(target);
                STATE.targetPool.push(target);
            }

            for (let i = 0; i < CONFIG.PARTICLE_POOL_SIZE; i++) {
                const particle = createParticleMesh();
                particle.visible = false;
                STATE.scene.add(particle);
                STATE.particlePool.push(particle);
            }
        }

        function createTargetMesh() {
            const geometry = new THREE.SphereGeometry(0.8, 8, 8); // Simplified geometry
            const material = new THREE.MeshLambertMaterial({ // Lighter than Phong
                color: 0x888888,
                emissive: 0x444444,
                emissiveIntensity: 0.3
            });
            const mesh = new THREE.Mesh(geometry, material);

            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: null }));
            sprite.scale.set(1.5, 1.5, 1);
            mesh.add(sprite);
            mesh.userData.sprite = sprite;

            return mesh;
        }

        function createParticleMesh() {
            const geometry = new THREE.SphereGeometry(0.1, 4, 4);
            const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
            return new THREE.Mesh(geometry, material);
        }

        function getTargetFromPool() {
            return STATE.targetPool.find(t => !t.visible) || createTargetMesh();
        }

        function getParticleFromPool() {
            return STATE.particlePool.find(p => !p.visible) || createParticleMesh();
        }

        function releaseTarget(target) {
            target.visible = false;
            target.userData = {};
        }

        function releaseParticle(particle) {
            particle.visible = false;
            particle.userData = {};
        }

        // ============================================
        // TARGET MANAGEMENT (VISUAL HINTS)
        // ============================================
        function createTarget(number, isAnswer, isStrategy) {
            const target = getTargetFromPool();

            // Color coding
            let color = 0x888888;
            if (isAnswer) color = 0x4CAF50;
            else if (isStrategy) color = 0xFFD700; // Gold for strategy

            target.material.color.setHex(color);
            target.material.emissive.setHex(color);
            target.material.emissiveIntensity = isAnswer ? 0.6 : isStrategy ? 0.5 : 0.3;

            // Position
            const angle = Math.random() * Math.PI * 2;
            const radius = 8 + Math.random() * 4;
            const height = -2 + Math.random() * 8;

            target.position.set(
                Math.cos(angle) * radius,
                height,
                Math.sin(angle) * radius - 10
            );

            // Text sprite
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 120px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(number.toString(), 128, 128);

            const texture = new THREE.CanvasTexture(canvas);
            target.userData.sprite.material.map = texture;
            target.userData.sprite.material.needsUpdate = true;

            target.userData = {
                number,
                isAnswer,
                isStrategy,
                velocity: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.03,
                    (Math.random() - 0.5) * 0.02,
                    (Math.random() - 0.5) * 0.01
                ),
                sprite: target.userData.sprite,
                pulsePhase: Math.random() * Math.PI * 2 // For pulsing animation
            };

            target.visible = true;
            STATE.targets.push(target);

            return target;
        }

        function spawnTargets() {
            STATE.targets.forEach(t => releaseTarget(t));
            STATE.targets = [];

            if (!STATE.currentQuestion) return;

            const { answer, strategy, allNumbers } = STATE.currentQuestion;

            allNumbers.forEach(num => {
                const isAnswer = num === answer;
                const isStrategy = strategy.includes(num) && !isAnswer;
                createTarget(num, isAnswer, isStrategy);
            });
        }

        function updateTargets(deltaTime) {
            const time = Date.now() * 0.001;

            STATE.targets.forEach(target => {
                target.position.add(target.userData.velocity);
                target.rotation.y += 0.02;

                // Bounce
                if (Math.abs(target.position.x) > 14) target.userData.velocity.x *= -1;
                if (target.position.y > 8 || target.position.y < -5) target.userData.velocity.y *= -1;
                if (target.position.z > 5 || target.position.z < -20) target.userData.velocity.z *= -1;

                // VISUAL HINT: Strategy targets pulse (simplified)
                if (target.userData.isStrategy && Math.random() < 0.1) {
                    const pulse = Math.sin(time * 2 + target.userData.pulsePhase) * 0.2 + 0.8;
                    target.material.emissiveIntensity = 0.5 * pulse;
                }
            });
        }

        // ============================================
        // MEDIAPIPE HANDS SETUP
        // ============================================
        async function initMediaPipe() {
            try {
                updateLoadingProgress(20, 'Requesting camera...');

                STATE.videoElement = document.getElementById('hiddenVideo');

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        facingMode: 'user',
                        width: { ideal: 480 }, // Lower resolution for performance
                        height: { ideal: 360 }
                    }
                });

                STATE.videoElement.srcObject = stream;
                await STATE.videoElement.play();

                updateLoadingProgress(50, 'Loading hand model...');

                STATE.hands = new Hands({
                    locateFile: (file) => {
                        return `https://unpkg.com/@mediapipe/hands@0.4.1646424915/${file}`;
                    }
                });

                STATE.hands.setOptions({
                    maxNumHands: 2,
                    modelComplexity: 0, // Lightest model for mobile
                    minDetectionConfidence: 0.6,
                    minTrackingConfidence: 0.5
                });

                STATE.hands.onResults(onHandsResults);

                updateLoadingProgress(80, 'Initializing model...');

                await new Promise(resolve => setTimeout(resolve, 300));

                updateLoadingProgress(100, 'Ready!');

                STATE.modelReady = true;

            } catch (error) {
                throw new Error(`Camera/MediaPipe init failed: ${error.message}`);
            }
        }

        function updateLoadingProgress(percent, text) {
            document.getElementById('progressFill').style.width = `${percent}%`;
            document.getElementById('loadingText').textContent = text;
        }

        function onHandsResults(results) {
            STATE.handsData = results.multiHandLandmarks || [];

            // Assign stable hand IDs
            if (results.multiHandedness) {
                STATE.handStates.forEach(hs => hs.landmarkIndex = null);

                results.multiHandedness.forEach((handedness, idx) => {
                    const label = handedness.label;
                    const handIndex = label === 'Left' ? 0 : 1;
                    if (STATE.handStates[handIndex]) {
                        STATE.handStates[handIndex].handedness = label;
                        STATE.handStates[handIndex].landmarkIndex = idx;
                    }
                });
            }
        }

        // ============================================
        // HAND GESTURE FSM
        // ============================================
        function updateHandGestures(deltaTime) {
            const now = Date.now();

            if (!STATE.handsData || STATE.handsData.length === 0) {
                STATE.handStates.forEach((hs, i) => {
                    hs.state = 'idle';
                    if (STATE.lasers[i]) {
                        STATE.scene.remove(STATE.lasers[i]);
                        STATE.lasers[i] = null;
                    }
                });
                return;
            }

            STATE.handStates.forEach((handState, handIndex) => {
                const landmarkIndex = handState.landmarkIndex;
                if (landmarkIndex === undefined || !STATE.handsData[landmarkIndex]) {
                    handState.state = 'idle';
                    if (STATE.lasers[handIndex]) {
                        STATE.scene.remove(STATE.lasers[handIndex]);
                        STATE.lasers[handIndex] = null;
                    }
                    return;
                }

                const landmarks = STATE.handsData[landmarkIndex];

                const indexTip = landmarks[8];
                const thumbTip = landmarks[4];
                const wrist = landmarks[0];

                const distance = Math.sqrt(
                    Math.pow(thumbTip.x - indexTip.x, 2) +
                    Math.pow(thumbTip.y - indexTip.y, 2) +
                    Math.pow(thumbTip.z - indexTip.z, 2)
                );

                const thumbSpeed = handState.lastPos ?
                    Math.sqrt(
                        Math.pow(thumbTip.x - handState.lastPos.x, 2) +
                        Math.pow(thumbTip.y - handState.lastPos.y, 2)
                    ) : 0;

                handState.lastPos = { x: thumbTip.x, y: thumbTip.y, z: thumbTip.z };

                const aimDir = new THREE.Vector3(
                    indexTip.x - wrist.x,
                    -(indexTip.y - wrist.y),
                    indexTip.z - wrist.z
                ).normalize();

                // Mirror mode - flip X for natural movement
                const worldX = -(indexTip.x - 0.5) * 35;
                const worldY = -(indexTip.y - 0.5) * 25;
                const worldZ = -8;

                const startPos = new THREE.Vector3(worldX, worldY, worldZ);

                updateLaser(handIndex, startPos, aimDir);

                const { ARM_THRESHOLD, FIRE_THRESHOLD, HYSTERESIS, V_MIN_THUMB, COOLDOWN_MS } = CONFIG.GESTURE;

                switch (handState.state) {
                    case 'idle':
                        if (distance < ARM_THRESHOLD * 2) {
                            handState.state = 'aiming';
                        }
                        break;

                    case 'aiming':
                        if (distance < ARM_THRESHOLD - HYSTERESIS) {
                            handState.state = 'armed';
                            handState.armedTime = now;
                        } else if (distance > ARM_THRESHOLD * 3) {
                            handState.state = 'idle';
                        }
                        break;

                    case 'armed':
                        if (distance > FIRE_THRESHOLD + HYSTERESIS && thumbSpeed > V_MIN_THUMB) {
                            handState.state = 'fired';
                            fireShot(startPos, aimDir, handIndex);
                        } else if (now - handState.armedTime > 2500) {
                            handState.state = 'aiming';
                        }
                        break;

                    case 'fired':
                        handState.state = 'cooldown';
                        handState.cooldownEnd = now + COOLDOWN_MS;
                        break;

                    case 'cooldown':
                        if (now >= handState.cooldownEnd) {
                            handState.state = 'aiming';
                        }
                        break;
                }
            });
        }

        function updateLaser(handIndex, startPos, direction) {
            if (STATE.lasers[handIndex]) {
                STATE.scene.remove(STATE.lasers[handIndex]);
            }

            // Crosshair (large circle for easy aiming)
            const targetPos = startPos.clone().add(direction.clone().multiplyScalar(15));

            const geometry = new THREE.RingGeometry(0.9, 1.4, 24); // Larger ring
            const color = handIndex === 0 ? 0xff3333 : 0x33ff33;
            const material = new THREE.MeshBasicMaterial({
                color,
                opacity: 0.9,
                transparent: true,
                side: THREE.DoubleSide
            });

            const crosshair = new THREE.Mesh(geometry, material);
            crosshair.position.copy(targetPos);
            crosshair.lookAt(startPos);

            // Add center dot (larger)
            const dotGeometry = new THREE.CircleGeometry(0.35, 12);
            const dot = new THREE.Mesh(dotGeometry, material);
            dot.position.set(0, 0, 0.01);
            crosshair.add(dot);

            STATE.scene.add(crosshair);
            STATE.lasers[handIndex] = crosshair;
        }

        function fireShot(origin, direction, handIndex) {
            playSFX('shoot');

            const playerIndex = STATE.gameMode === 'duo' ? handIndex : 0;
            STATE.players[playerIndex].shots++;

            createMuzzleFlash(origin);

            const raycaster = new THREE.Raycaster(origin, direction);
            const intersects = raycaster.intersectObjects(STATE.targets.filter(t => t.visible));

            if (intersects.length > 0) {
                const hit = intersects[0].object;
                handleTargetHit(hit, playerIndex);
            } else {
                showFeedback(`${STATE.players[playerIndex].name} MISS`, '#888888');
                playSFX('miss');
            }
        }

        function handleTargetHit(target, playerIndex) {
            const { isAnswer, isStrategy, number } = target.userData;

            releaseTarget(target);
            STATE.targets = STATE.targets.filter(t => t !== target);

            STATE.players[playerIndex].hits++;

            createExplosion(target.position, isAnswer ? 0x4CAF50 : isStrategy ? 0xFFD700 : 0xff4444);

            if (isAnswer) {
                STATE.players[playerIndex].score += CONFIG.SCORE_CORRECT;
                STATE.players[playerIndex].streak++;
                STATE.players[playerIndex].bestStreak = Math.max(
                    STATE.players[playerIndex].bestStreak,
                    STATE.players[playerIndex].streak
                );

                showFeedback(`${STATE.players[playerIndex].name} CORRECT! +${CONFIG.SCORE_CORRECT}`, '#4CAF50');
                playSFX('correct');

                // Adaptive difficulty
                if (STATE.players[playerIndex].streak >= 5 && STATE.difficultyLevel < 4) {
                    STATE.difficultyLevel++;
                }

                nextQuestion();

            } else if (isStrategy) {
                STATE.players[playerIndex].score += CONFIG.SCORE_SMART;
                STATE.players[playerIndex].streak++;
                STATE.players[playerIndex].bestStreak = Math.max(
                    STATE.players[playerIndex].bestStreak,
                    STATE.players[playerIndex].streak
                );

                showFeedback(`${STATE.players[playerIndex].name} SMART! +${CONFIG.SCORE_SMART}`, '#FFD700');
                playSFX('smart'); // Better sound for smart strategy

            } else {
                STATE.players[playerIndex].score = Math.max(0, STATE.players[playerIndex].score - CONFIG.PENALTY_WRONG);
                // Gentle streak drop: only decrease by 1
                STATE.players[playerIndex].streak = Math.max(0, STATE.players[playerIndex].streak - 1);

                showFeedback(`${STATE.players[playerIndex].name} WRONG -${CONFIG.PENALTY_WRONG}`, '#ff4444');
                playSFX('wrong');

                // Reduce difficulty after mistakes
                if (STATE.players[playerIndex].streak === 0 && STATE.difficultyLevel > 1) {
                    STATE.difficultyLevel = Math.max(1, STATE.difficultyLevel - 1);
                }
            }

            updateHUD();
        }

        // ============================================
        // VFX SYSTEM
        // ============================================
        function createMuzzleFlash(position) {
            const flash = getParticleFromPool();
            flash.position.copy(position);
            flash.scale.setScalar(0.5);
            flash.material.color.setHex(0xffff00);
            flash.material.opacity = 1;
            flash.visible = true;

            setTimeout(() => releaseParticle(flash), 80);
        }

        function createExplosion(position, color) {
            const particleCount = Math.min(10, CONFIG.PARTICLE_POOL_SIZE - STATE.particles.length); // Reduced for performance

            for (let i = 0; i < particleCount; i++) {
                const particle = getParticleFromPool();

                particle.position.copy(position);
                particle.material.color.setHex(color);
                particle.material.opacity = 1;
                particle.scale.setScalar(1);

                const velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.4,
                    (Math.random() - 0.5) * 0.4,
                    (Math.random() - 0.5) * 0.4
                );

                particle.userData = {
                    velocity,
                    life: 1.0,
                    maxLife: 1.0
                };

                particle.visible = true;
                STATE.particles.push(particle);
            }
        }

        function updateParticles(deltaTime) {
            STATE.particles = STATE.particles.filter(p => {
                p.position.add(p.userData.velocity);
                p.userData.velocity.y -= 0.015;
                p.userData.life -= deltaTime * 2.5;

                p.material.opacity = p.userData.life / p.userData.maxLife;

                if (p.userData.life <= 0) {
                    releaseParticle(p);
                    return false;
                }
                return true;
            });
        }

        // ============================================
        // UI SYSTEM
        // ============================================
        function showOverlay(id) {
            document.querySelectorAll('.overlay').forEach(o => o.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        function hideAllOverlays() {
            document.querySelectorAll('.overlay').forEach(o => o.classList.add('hidden'));
        }

        function showFeedback(text, color) {
            const existing = document.querySelector('.feedback');
            if (existing) existing.remove();

            const feedback = document.createElement('div');
            feedback.className = 'feedback';
            feedback.textContent = text;
            feedback.style.color = color;
            document.body.appendChild(feedback);

            setTimeout(() => feedback.remove(), 800);
        }

        function updateHUD() {
            document.getElementById('questionCount').textContent = STATE.questionIndex;
            document.getElementById('timeDisplay').textContent = Math.ceil(Math.max(0, STATE.timeLeft));

            const playerScores = document.getElementById('playerScores');
            playerScores.innerHTML = '';

            const activePlayers = STATE.gameMode === 'duo' ? 2 : 1;

            for (let i = 0; i < activePlayers; i++) {
                const p = STATE.players[i];
                p.accuracy = p.shots > 0 ? Math.round((p.hits / p.shots) * 100) : 0;

                const div = document.createElement('div');
                div.className = `player-score p${i + 1}`;

                if (p.streak >= 5) {
                    div.classList.add('streak-glow');
                }

                div.innerHTML = `
                    ${p.name}: ${p.score} | 🔥 ${p.streak} | 🎯 ${p.accuracy}%
                `;
                playerScores.appendChild(div);
            }

            if (STATE.currentQuestion) {
                document.getElementById('questionDisplay').textContent = STATE.currentQuestion.question;
            }
        }

        function nextQuestion() {
            STATE.questionIndex++;

            if (STATE.questionIndex >= CONFIG.QUESTIONS_PER_ROUND) {
                endRound();
                return;
            }

            STATE.currentQuestion = generateQuestion();
            spawnTargets();
            updateHUD();
        }

        function endRound() {
            STATE.isRunning = false;
            saveBestScores();
            showRanking();
        }

        function saveBestScores() {
            try {
                const scores = JSON.parse(localStorage.getItem('mathShootingBestScores') || '[]');

                const activePlayers = STATE.gameMode === 'duo' ? 2 : 1;

                for (let i = 0; i < activePlayers; i++) {
                    const p = STATE.players[i];
                    scores.push({
                        name: p.name,
                        score: p.score,
                        streak: p.bestStreak,
                        accuracy: p.accuracy,
                        date: new Date().toISOString()
                    });
                }

                scores.sort((a, b) => b.score - a.score || b.streak - a.streak || b.accuracy - a.accuracy);

                localStorage.setItem('mathShootingBestScores', JSON.stringify(scores.slice(0, 50)));

                STATE.bestScores = scores;
            } catch (e) {
                console.warn('localStorage not available:', e);
            }
        }

        function showRanking() {
            const ranking = document.getElementById('rankingDisplay');
            ranking.innerHTML = '';

            const activePlayers = STATE.gameMode === 'duo' ? 2 : 1;

            const currentPlayers = STATE.players.slice(0, activePlayers)
                .map((p, i) => ({ ...p, index: i, current: true }))
                .sort((a, b) => b.score - a.score || b.bestStreak - a.bestStreak || b.accuracy - a.accuracy);

            const allBest = STATE.bestScores.slice(0, 5);

            // Merge current with all-time
            const display = [...currentPlayers];

            allBest.forEach(best => {
                if (!display.some(p => p.score === best.score && p.name === best.name)) {
                    display.push(best);
                }
            });

            display.slice(0, 5).forEach((p, rank) => {
                const entry = document.createElement('div');
                entry.className = `ranking-entry rank-${rank + 1}`;
                if (p.current) entry.classList.add('current');

                const medal = rank === 0 ? '🥇' : rank === 1 ? '🥈' : rank === 2 ? '🥉' : `${rank + 1}.`;

                entry.innerHTML = `
                    <span>${medal} ${p.name}</span>
                    <span>${p.score} pts | 🔥 ${p.bestStreak || p.streak} | 🎯 ${p.accuracy}%</span>
                `;
                ranking.appendChild(entry);
            });

            showOverlay('rankingOverlay');
        }

        // ============================================
        // GAME LOOP
        // ============================================
        function gameLoop(timestamp) {
            if (!STATE.isRunning || STATE.isPaused) return;

            const deltaTime = (timestamp - STATE.lastRenderTime) / 1000;
            STATE.lastRenderTime = timestamp;

            const elapsed = (timestamp - STATE.gameStartTime) / 1000;
            STATE.timeLeft = Math.max(0, CONFIG.TIME_LIMIT - elapsed);

            if (STATE.timeLeft <= 0 && STATE.questionIndex < CONFIG.QUESTIONS_PER_ROUND) {
                endRound();
                return;
            }

            updateTargets(deltaTime);
            updateParticles(deltaTime);
            updateHUD();

            STATE.renderer.render(STATE.scene, STATE.camera);

            requestAnimationFrame(gameLoop);
        }

        async function detectionLoop() {
            if (!STATE.isRunning || STATE.isPaused || !STATE.modelReady) return;

            const now = Date.now();

            if (now - STATE.lastDetectionTime >= STATE.detectionInterval) {
                try {
                    await STATE.hands.send({ image: STATE.videoElement });
                    updateHandGestures(STATE.detectionInterval / 1000);
                    STATE.lastDetectionTime = now;
                } catch (error) {
                    console.error('Detection error:', error);
                    showError('Hand tracking error. Please retry.');
                    STATE.isRunning = false;
                    return;
                }
            }

            if (STATE.isRunning && !STATE.isPaused) {
                setTimeout(detectionLoop, 16);
            }
        }

        // ============================================
        // GAME LIFECYCLE
        // ============================================
        async function startGame(mode) {
            try {
                STATE.gameMode = mode;

                showOverlay('loadingOverlay');
                updateLoadingProgress(0, 'Starting...');

                if (!STATE.audioContext) {
                    await initAudio();
                }

                if (!STATE.scene) {
                    initThreeJS();
                }

                if (!STATE.modelReady) {
                    await initMediaPipe();
                }

                updateLoadingProgress(100, 'Ready!');
                await new Promise(resolve => setTimeout(resolve, 200));

                // Reset
                STATE.questionIndex = 0;
                STATE.timeLeft = CONFIG.TIME_LIMIT;
                STATE.difficultyLevel = 1;
                STATE.handStates = [
                    { state: 'idle', handedness: null, lastPos: null, cooldownEnd: 0, landmarkIndex: null },
                    { state: 'idle', handedness: null, lastPos: null, cooldownEnd: 0, landmarkIndex: null }
                ];

                STATE.players.forEach(p => {
                    p.score = 0;
                    p.streak = 0;
                    p.bestStreak = 0;
                    p.accuracy = 0;
                    p.shots = 0;
                    p.hits = 0;
                });

                STATE.currentQuestion = generateQuestion();
                spawnTargets();

                document.getElementById('hud').classList.remove('hidden');
                hideAllOverlays();
                updateHUD();

                STATE.isRunning = true;
                STATE.isPaused = false;
                STATE.gameStartTime = performance.now();
                STATE.lastRenderTime = STATE.gameStartTime;

                requestAnimationFrame(gameLoop);
                detectionLoop();

            } catch (error) {
                showError(error.message);
            }
        }

        function retryGame() {
            window.location.reload();
        }

        function nextRound() {
            startGame(STATE.gameMode);
        }

        function backToMenu() {
            window.location.reload();
        }

        function showError(message) {
            document.getElementById('errorMessage').textContent = message;
            showOverlay('errorOverlay');
        }

        // ============================================
        // PAGE VISIBILITY HANDLING
        // ============================================
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                STATE.isPaused = true;
                if (STATE.audioContext && STATE.audioContext.state === 'running') {
                    STATE.audioContext.suspend();
                }
            } else {
                STATE.isPaused = false;
                if (STATE.audioContext && STATE.audioContext.state === 'suspended') {
                    STATE.audioContext.resume();
                }
            }
        });

        // ============================================
        // INITIALIZATION
        // ============================================
        window.addEventListener('load', () => {
            console.log('✅ Math Shooting Game loaded!');

            // Load best scores
            try {
                STATE.bestScores = JSON.parse(localStorage.getItem('mathShootingBestScores') || '[]');
            } catch (e) {
                STATE.bestScores = [];
            }
        });

        // Prevent scroll/bounce
        document.body.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });

        // Prevent double-tap zoom
        let lastTap = 0;
        document.addEventListener('touchend', (e) => {
            const now = Date.now();
            if (now - lastTap < 300) {
                e.preventDefault();
            }
            lastTap = now;
        });

    </script>
</body>
